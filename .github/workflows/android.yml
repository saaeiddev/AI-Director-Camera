name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project source
        shell: bash
        run: |
          unzip -q AI-Director-Camera-Source.zip
          sed -i 's/compileSdk = 37/compileSdk = 36/' AI-Director-Camera/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' AI-Director-Camera/app/build.gradle.kts

      - name: Build debug APK
        working-directory: AI-Director-Camera
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare final APK
        shell: bash
        run: |
          test -f AI-Director-Camera/app/build/outputs/apk/debug/app-debug.apk
          cp AI-Director-Camera/app/build/outputs/apk/debug/app-debug.apk AI-Director-Camera.apk
          sha256sum AI-Director-Camera.apk > AI-Director-Camera.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Director-Camera-APK
          path: |
            AI-Director-Camera.apk
            AI-Director-Camera.apk.sha256
          if-no-files-found: error
          retention-days: 30
