name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and patch source
        shell: bash
        run: |
          cat source-chunks/part*.b64 | base64 -d > AI-Director-Camera-Source-valid.zip
          unzip -t AI-Director-Camera-Source-valid.zip
          unzip -q AI-Director-Camera-Source-valid.zip
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.09.01/' AI-Director-Camera/app/build.gradle.kts
          sed -i 's/core-ktx:1.19.1/core-ktx:1.17.0/' AI-Director-Camera/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.11.0/' AI-Director-Camera/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.4/' AI-Director-Camera/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.9.4/' AI-Director-Camera/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          root = Path("AI-Director-Camera/build.gradle.kts")
          text = root.read_text()
          needle = '    id("org.jetbrains.kotlin.plugin.compose") version "2.4.20" apply false\n'
          if 'id("com.google.devtools.ksp")' not in text:
              text = text.replace(
                  needle,
                  needle + '    id("com.google.devtools.ksp") version "2.3.10" apply false\n'
              )
          root.write_text(text)

          app = Path("AI-Director-Camera/app/build.gradle.kts")
          text = app.read_text()
          text = text.replace('    id("com.android.legacy-kapt")\n', '    id("com.google.devtools.ksp")\n')
          text = text.replace('kapt {\n    correctErrorTypes = true\n}\n\n', '')
          text = text.replace('    kapt("androidx.room:room-compiler:$room")', '    ksp("androidx.room:room-compiler:$room")')
          app.write_text(text)
          PY
          sed -i '/import androidx.compose.foundation.layout.weight/d' AI-Director-Camera/app/src/main/java/com/saeid/aidirectorcamera/ui/App.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' AI-Director-Camera/app/src/main/java/com/saeid/aidirectorcamera/ui/CameraScreen.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' AI-Director-Camera/app/src/main/java/com/saeid/aidirectorcamera/ui/ProjectsScreen.kt
          echo "--- patched root plugins ---"
          sed -n '1,12p' AI-Director-Camera/build.gradle.kts
          echo "--- patched app dependencies ---"
          grep -E 'compileSdk|targetSdk|compose-bom|core-ktx|activity-compose|lifecycle-runtime|devtools.ksp|room-compiler' AI-Director-Camera/app/build.gradle.kts

      - name: Build debug APK
        working-directory: AI-Director-Camera
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare and verify APK
        shell: bash
        run: |
          test -f AI-Director-Camera/app/build/outputs/apk/debug/app-debug.apk
          cp AI-Director-Camera/app/build/outputs/apk/debug/app-debug.apk AI-Director-Camera.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose AI-Director-Camera.apk
          sha256sum AI-Director-Camera.apk > AI-Director-Camera.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Director-Camera-APK
          path: |
            AI-Director-Camera.apk
            AI-Director-Camera.apk.sha256
          if-no-files-found: error
          retention-days: 30
