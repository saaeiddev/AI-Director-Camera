name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/web-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run pure logic smoke tests
        shell: bash
        run: bash scripts/run-logic-tests.sh

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare and verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk AI-Director-Camera.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs AI-Director-Camera.apk
          sha256sum AI-Director-Camera.apk > AI-Director-Camera.apk.sha256
          ls -lh AI-Director-Camera.apk AI-Director-Camera.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Director-Camera-APK
          path: |
            AI-Director-Camera.apk
            AI-Director-Camera.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.1.0-mvp"
          cat > release-notes.md <<'NOTES'
          ## AI Director Camera v0.1.0 MVP

          Native Android cinematography-assistant MVP with CameraX recording, on-device shot guidance, motion analysis, ML Kit pose detection, project storage, and ARCore capability detection.

          ### Included files
          - `AI-Director-Camera.apk` — debug-signed installable APK
          - `AI-Director-Camera.apk.sha256` — SHA-256 checksum

          ### Validation
          - Gradle build passed
          - Pure Kotlin logic smoke tests passed
          - APK signature verification passed with `apksigner`

          This is an MVP/development build. Camera and AR behavior still requires real-device QA across representative Android devices.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AI-Director-Camera.apk AI-Director-Camera.apk.sha256 --clobber
            gh release edit "$TAG" --title "AI Director Camera v0.1.0 MVP" --notes-file release-notes.md
          else
            gh release create "$TAG"               AI-Director-Camera.apk               AI-Director-Camera.apk.sha256               --target "$GITHUB_SHA"               --title "AI Director Camera v0.1.0 MVP"               --notes-file release-notes.md
          fi
